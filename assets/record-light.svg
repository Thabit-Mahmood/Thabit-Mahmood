<svg xmlns="http://www.w3.org/2000/svg" width="840" height="458" viewBox="0 0 840 458" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">Thabit Mahmood, fields of work</title><desc id="d">Research: My doctoral research explores federated learning that every participant can verify and that remains secure against quantum adversaries. Engineering: I build what I research, from protocol design to working code, mostly in Python, Rust, Go and TypeScript. Published: Published research on intrusion detection for drone networks, federated detection of zero-day threats and deep learning for healthcare. Service: Committee member, 3rd International Conference on Emerging Trends and Innovation (ICETI, Springer).</desc><style>@font-face{font-family:M;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
