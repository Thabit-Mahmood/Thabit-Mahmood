<svg xmlns="http://www.w3.org/2000/svg" width="840" height="482" viewBox="0 0 840 482" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">Thabit Mahmood, fields of work</title><desc id="d">Research: My PhD makes federated learning verifiable and quantum-safe: every participant can check the shared model, and the cryptography holds against quantum adversaries. Engineering: I build what I research, from protocol design to working code, mostly in Python, Rust, Go and TypeScript. Published: Co-author of published work on intrusion detection for drone networks, federated detection of zero-day threats and deep learning for healthcare. Service: Organising committees of academic conferences.</desc><style>@font-face{font-family:M;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
