<text x="48" y="314" class="s " font-size="15.5" font-weight="400" font-style="normal" fill="#1A222C" text-anchor="start">for drone networks, federated detection of zero-day</text>
<text x="48" y="338" class="s " font-size="15.5" font-weight="400" font-style="normal" fill="#1A222C" text-anchor="start">threats and deep learning for healthcare.</text>
<text x="48" y="362" class="s " font-size="14" font-weight="400" font-style="italic" fill="#66707B" text-anchor="start">Full list on ORCID.</text>
<text x="436" y="112" class="m " font-size="10" font-weight="400" font-style="normal" fill="#1F6E64" text-anchor="start" letter-spacing="2">ENGINEERING</text>
<text x="436" y="140" class="s " font-size="15.5" font-weight="400" font-style="normal" fill="#1A222C" text-anchor="start">I build what I research, from protocol design to</text>
