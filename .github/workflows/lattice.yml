name: contribution lattice

on:
  schedule:
    - cron: "23 16 * * *"   # 00:23 in Cyberjaya (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/lattice.py"
      - "scripts/kit.py"
      - ".github/workflows/lattice.yml"

permissions:
  contents: write

concurrency:
  group: lattice
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render lattice from the live calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/lattice.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/lattice.svg; then
            echo "lattice unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lattice.svg
          git commit -m "chore(lattice): daily render"
          git push
