name: credential

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 16 * * *"   # 00:17 in Cyberjaya: re-verify daily
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: credential
  cancel-in-progress: false

jobs:
  credential:
    # issues only matter when they ask for a handshake; titles are compared, never executed
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.type != 'Bot' &&
       (startsWith(github.event.issue.title, 'handshake') ||
        startsWith(github.event.issue.title, 'Handshake') ||
        startsWith(github.event.issue.title, 'HANDSHAKE')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet "cryptography>=46" fonttools brotli

      - name: Sign the record if it changed
        env:
          PROFILE_SIGNING_SEED: ${{ secrets.PROFILE_SIGNING_SEED }}
        run: python scripts/sign.py

      - name: Handshake with the issue author
        if: github.event_name == 'issues'
        env:
          PROFILE_SIGNING_SEED: ${{ secrets.PROFILE_SIGNING_SEED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LOGIN: ${{ github.event.issue.user.login }}
          USER_TYPE: ${{ github.event.issue.user.type }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/handshake.py

      - name: Verify every signature
        run: python verify.py --status assets/status.json || echo "VERIFY_FAILED=1" >> "$GITHUB_ENV"

      - name: Render the cards from the result
        run: python scripts/build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A identity assets
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "chore(credential): verify and render"
          git pull --rebase --autostash origin main
          git push

      - name: Fail loudly if a signature did not verify
        if: env.VERIFY_FAILED == '1'
        run: exit 1
